<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow:row nowrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            
        }
        div#cxA {
            /*flex-shrink: 0;  
            flex-grow: 1;
            flex-basis:200px;*/

            flex: 1 0 200px; /* flex-grow, flex-shrink, flex-basis */

        }
        div#cxB {
            /*flex-shrink: 0;
            flex-grow: 1; 
            flex-basis:200px;*/
            flex: 1 0 150px; 
            /* flex-grow, flex-shrink, flex-basis */

 
        }
        div#cxC {
            /*flex-shrink: 0; 
            flex-grow: 1; 
            flex-basis:auto;*/

            flex: 1 0 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--PAI-->
     <!--FILHO-->    <div class="item" id="cxA">A</div>  <!-- Para duplicar uma linha dentro do código (ou uma parte grande selecionada), usem shift+alt+seta -->
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        

    </div>
</body>
</html>
