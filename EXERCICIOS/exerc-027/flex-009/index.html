<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }
        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            /* flex-basis:auto;  padrão(se adapta ao conteúdo) */
            flex-basis:150px;/* define o tamanho base do item */
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--PAI-->
     <!--FILHO-->    <div class="item">A</div>  <!-- Para duplicar uma linha dentro do código (ou uma parte grande selecionada), usem shift+alt+seta -->
        <div class="item">Outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">Conteúdo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">Conteúdo maior ainda ,vai ocupar mais espaço.</div>
        <div class="item">G</div>

    </div>
</body>
</html>
