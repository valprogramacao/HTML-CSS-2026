<!DOCTYPE html>
<html lang="pt-br">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
      <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        table {
            width: 300px;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        </style>
<head>
</head>
<body>

    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td> <!--ocupando 2 colunas -->

           <!--  <td>C</td>    retirando a célula C,para mesclar a célula B com a célula C, usando o atributo colspan="2" --> 

        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td rowspan="2">F</td>  <!--ocupando 2 linhas -->
        </tr>
        <tr>
        <!-- <td>G</td> retirando a célula G,para mesclar a célula D com a célula G e J, usando o atributo rowspan="3" --> 

            <td>H</td>
            <!-- <td>I</td> -->
        </tr>
        <tr>
            <!-- <td>J</td> -->
            <td>K</td>
            <td>L</td>
        </tr>
    

</body>
</html>
