<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            display: grid;
            grid-template-columns: 100px 40% repeat(2, 1fr);
            grid-template-rows: repeat(3,80px); 
            grid-auto-flow:row;
            grid-auto-rows: 80px;
            grid-auto-columns:120px;
            gap: 5px;
            /* align-items:start;
               justify-items:center; */
            place-items: normal normal;
            /* align-content:space-between;
               justify-content:end; */
            place-content: normal normal;


        }
        div.item {
            border: 3px solid red; 
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">  <!--div.container(tecla enter e ele cria a div com a classe container) -->
    <div class="item">A</div> <!--div.item * 7(tecla enter e ele cria as 7 div com a classe item) -->
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
    <div class="item">H</div>
    <div class="item">I</div>
    <div class="item">J</div>
</div>    
    
</body>
</html>
